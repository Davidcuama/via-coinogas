<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radicación de Requerimiento - VIA Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Radicación de Órdenes de Compra (ADM-F-22)</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <!-- Campos vacíos listos para que Villada y Posso conecten sus modelos -->
                    <div class="mb-3">
                        <label for="area" class="form-label">Área Solicitante</label>
                        <input type="text" class="form-control" id="area" name="area" value="" autocomplete="off" placeholder="Ingrese el área">
                    </div>
                    <div class="mb-3">
                        <label for="centro_costo" class="form-label">Centro de Costo</label>
                        <input type="text" class="form-control" id="centro_costo" name="centro_costo" value="" autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-success">Guardar Borrador</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
