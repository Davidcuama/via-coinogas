# Pipeline de integración continua de VIA Compras.
# Se ejecuta en cada push y en cada pull request hacia main.
# Un PR no puede fusionarse si este pipeline falla (ver "Calidad del Software" en la Wiki).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    name: Calidad de código (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Linter y estándar de nombramiento
        run: ruff check --output-format=github .
      - name: Formato de código
        run: ruff format --check .

  seguridad:
    name: Vulnerabilidades en dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  pruebas:
    name: Pruebas automatizadas (Django)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: via_coinogas
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: clave-solo-para-ci
      DEBUG: "False"
      DB_ENGINE: postgresql
      DB_NAME: via_coinogas
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # requirements-dev.txt incluye requirements.txt y además coverage.
      - run: pip install -r requirements-dev.txt
      - name: Verificación de configuración de Django
        run: python manage.py check
      - name: Migraciones sin cambios pendientes
        run: python manage.py makemigrations --check --dry-run
      - name: Pruebas con medición de cobertura
        run: coverage run manage.py test --verbosity 2
      # Falla el pipeline si la cobertura baja del mínimo (fail_under en pyproject.toml).
      - name: Reporte de cobertura (mínimo exigido)
        run: coverage report
      - name: Generar reporte HTML de cobertura
        if: always()
        run: coverage html
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: htmlcov/
