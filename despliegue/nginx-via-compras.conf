# Sitio de nginx para VIA Compras.
#
# Instalación (ver despliegue/README.md):
#   sudo cp despliegue/nginx-via-compras.conf /etc/nginx/sites-available/via-compras
#   (reemplazar DOMINIO por el dominio real)
#   sudo ln -s /etc/nginx/sites-available/via-compras /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, certbot agrega el bloque HTTPS y la redirección desde HTTP:
#   sudo certbot --nginx -d DOMINIO
#
# nginx recibe el tráfico y se lo pasa a gunicorn. Los estáticos los sirve
# WhiteNoise desde Django, así que aquí no hace falta una ruta para ellos.
#
# A propósito NO hay una ruta /media/: los adjuntos de HU-11 se entregan por una
# vista de Django que revisa que quien los pide tenga derecho a verlos. Servirlos
# desde nginx se saltaría esa revisión.

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # HU-11 admite hasta 10 adjuntos de 10 MB por requerimiento, más el resto
    # del formulario. Por encima de esto nginx corta antes de llegar a Django.
    client_max_body_size 105M;

    location / {
        proxy_pass http://unix:/run/via-compras/gunicorn.sock;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django confía en esta cabecera para saber si la conexión original era
        # HTTPS (SECURE_PROXY_SSL_HEADER). Se sobrescribe siempre con el esquema
        # real, de modo que un cliente no pueda falsearla.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
